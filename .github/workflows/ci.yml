name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build package (dist/)
        run: npm run build:lib

      - name: Benches (src and dist)
        run: |
          npm run benches
          node scripts/check-benches.mjs --dist

      - name: Pack + install smoke test
        run: npm run smoke:pack

      - name: Build website (dist-site/)
        run: npm run build:site
