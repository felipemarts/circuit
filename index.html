<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111827;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f172a;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }

    header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #22d3ee;
      white-space: nowrap;
      letter-spacing: -0.3px;
    }

    .toolbar {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .toolbar button {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .toolbar button:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .toolbar button.active {
      background: #22d3ee;
      color: #0f172a;
      border-color: #22d3ee;
      font-weight: 600;
    }

    .toolbar .sep {
      width: 1px;
      height: 20px;
      background: #334155;
      margin: 0 3px;
    }

    .actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .actions button {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
    }

    .actions .simulate {
      background: #059669;
      color: #fff;
      border-color: #059669;
      font-weight: 600;
    }

    .actions .simulate:hover {
      background: #10b981;
    }

    .actions .transient-btn {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
      font-weight: 600;
    }

    .actions .transient-btn:hover {
      background: #8b5cf6;
    }

    .actions .demo-btn {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
      font-weight: 600;
    }

    .actions .demo-btn:hover {
      background: #0ea5e9;
    }

    .actions .danger { color: #f87171; }
    .actions .danger:hover { background: #dc2626; color: white; border-color: #dc2626; }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
    }

    .bottom-panel {
      height: 260px;
      border-top: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .bottom-tabs {
      display: flex;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 0 8px;
      gap: 2px;
      flex-shrink: 0;
    }

    .bottom-tabs .tab {
      background: transparent;
      color: #64748b;
      border: none;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.12s;
    }

    .bottom-tabs .tab:hover {
      color: #94a3b8;
    }

    .bottom-tabs .tab.active {
      color: #22d3ee;
      border-bottom-color: #22d3ee;
    }

    .bottom-tabs .tab-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .bottom-tabs .tab-actions button {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
    }

    .bottom-tabs .tab-actions button:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .bottom-tabs .tab-actions .run-btn {
      background: #059669;
      color: #fff;
      border-color: #059669;
      font-weight: 600;
    }

    .bottom-tabs .tab-actions .run-btn:hover {
      background: #10b981;
    }

    .bottom-tabs .tab-actions .gen-btn {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
      font-weight: 600;
    }

    .bottom-tabs .tab-actions .gen-btn:hover {
      background: #8b5cf6;
    }

    .tab-content {
      flex: 1;
      overflow: hidden;
      display: none;
    }

    .tab-content.active {
      display: flex;
    }

    .editor-area {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .editor-area-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #code-editor {
      flex: 3;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      padding: 10px 12px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    #console-output {
      flex: 2;
      background: #080e1a;
      border-left: 1px solid #1e293b;
      padding: 8px 12px;
      overflow-y: auto;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #94a3b8;
    }

    #console-output .log-line { color: #e2e8f0; }
    #console-output .error-line { color: #f87171; }
    #console-output .warn-line { color: #fbbf24; }

    #chart-content {
      position: relative;
    }

    #chart-content .chart-close-btn {
      position: absolute;
      top: 4px;
      right: 8px;
      z-index: 5;
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }

    #chart-content .chart-close-btn:hover {
      background: #475569;
      color: #e2e8f0;
    }

    #chart-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sidebar {
      width: 260px;
      background: #0f172a;
      border-left: 1px solid #1e293b;
      padding: 12px;
      overflow-y: auto;
      font-size: 13px;
    }

    .sidebar h2 {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e293b;
    }

    .sidebar .prop-group { margin-bottom: 10px; }

    .sidebar label {
      display: block;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .sidebar input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .sidebar input:focus {
      outline: none;
      border-color: #22d3ee;
      box-shadow: 0 0 0 2px rgba(34,211,238,0.15);
    }

    .results { margin-top: 16px; }

    .results .result-item {
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .results .result-item .comp-name {
      color: #22d3ee;
      font-weight: 600;
      min-width: 50px;
    }

    .results .result-item .value {
      color: #fbbf24;
    }

    .status-bar {
      background: #0f172a;
      padding: 3px 12px;
      font-size: 10px;
      color: #475569;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1e293b;
    }

    #value-dialog {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #value-dialog.visible { display: flex; }

    #value-dialog .dialog-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      min-width: 300px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    #value-dialog .dialog-box h3 {
      color: #e2e8f0;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 600;
    }

    #value-dialog .dialog-box input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
    }

    #value-dialog .dialog-box input:focus {
      outline: none;
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34,211,238,0.15);
    }

    #value-dialog .dialog-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    #value-dialog .dialog-buttons button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    #value-dialog .dialog-buttons .btn-ok {
      background: #059669;
      color: #fff;
    }

    #value-dialog .dialog-buttons .btn-ok:hover { background: #10b981; }

    .sidebar .sim-controls {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }

    .sidebar .sim-controls h2 {
      color: #7c3aed;
    }

    #value-dialog .dialog-buttons .btn-cancel {
      background: #334155;
      color: #94a3b8;
    }

    #value-dialog .dialog-buttons .btn-cancel:hover { background: #475569; }

    /* ─── File tabs bar ─────────────────────────────────────────────── */

    .file-tabs-bar {
      display: flex;
      align-items: center;
      background: #0a0f1a;
      border-bottom: 1px solid #1e293b;
      height: 28px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .file-tabs-bar::-webkit-scrollbar { display: none; }

    .file-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 11px;
      color: #64748b;
      cursor: pointer;
      border-right: 1px solid #1e293b;
      white-space: nowrap;
      user-select: none;
      transition: all 0.12s;
    }

    .file-tab:hover { color: #94a3b8; background: #111827; }
    .file-tab.active { color: #22d3ee; background: #1e293b; }
    .file-tab.drag-over { border-left: 2px solid #22d3ee; }
    .file-tab.dragging { opacity: 0.4; }

    .file-tab .close-btn {
      font-size: 13px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.12s;
      color: #64748b;
    }

    .file-tab:hover .close-btn { opacity: 0.7; }
    .file-tab .close-btn:hover { opacity: 1; color: #f87171; }

    .file-tab-add {
      color: #475569;
      font-size: 14px;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      border-right: none;
    }

    .file-tab-add:hover { color: #22d3ee; background: #111827; }

    /* ─── Code editor wrapper with line numbers ─────────────────────── */

    .code-editor-wrapper {
      flex: 3;
      display: flex;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }

    .line-numbers {
      width: 40px;
      background: #0a0f1a;
      color: #334155;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 10px 8px 10px 0;
      text-align: right;
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
      white-space: pre;
      border-right: 1px solid #1e293b;
    }

    .editor-highlight {
      position: absolute;
      top: 0;
      left: 40px;
      right: 0;
      bottom: 0;
      margin: 0;
      padding: 10px 12px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      pointer-events: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #e2e8f0;
      tab-size: 2;
      z-index: 1;
    }

    .editor-highlight .hl-keyword { color: #c084fc; }
    .editor-highlight .hl-string { color: #86efac; }
    .editor-highlight .hl-number { color: #fbbf24; }
    .editor-highlight .hl-comment { color: #475569; font-style: italic; }

    #code-editor {
      flex: 1;
      background: transparent;
      color: transparent;
      caret-color: #e2e8f0;
      border: none;
      padding: 10px 12px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
      position: relative;
      z-index: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* ─── Project menu ──────────────────────────────────────────────── */

    .project-menu-wrapper {
      position: relative;
    }

    #btn-project {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
    }

    #btn-project:hover { background: #334155; color: #e2e8f0; }

    .project-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      min-width: 180px;
      z-index: 50;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .project-dropdown.visible { display: block; }

    .project-dropdown button {
      display: block;
      width: 100%;
      background: none;
      color: #94a3b8;
      border: none;
      padding: 8px 14px;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.12s;
    }

    .project-dropdown button:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .project-dropdown hr {
      border: none;
      border-top: 1px solid #334155;
      margin: 0;
    }

    /* ─── Project dialog ────────────────────────────────────────────── */

    #project-dialog {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #project-dialog.visible { display: flex; }

    #project-dialog .dialog-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      min-width: 360px;
      max-width: 500px;
      max-height: 70vh;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    #project-dialog .dialog-box h3 {
      color: #e2e8f0;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 600;
    }

    #project-dialog .dialog-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    #project-dialog .dialog-buttons button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    #project-dialog .dialog-buttons .btn-ok {
      background: #059669;
      color: #fff;
    }

    #project-dialog .dialog-buttons .btn-ok:hover { background: #10b981; }

    #project-dialog .dialog-buttons .btn-cancel {
      background: #334155;
      color: #94a3b8;
    }

    #project-dialog .dialog-buttons .btn-cancel:hover { background: #475569; }

    .project-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .project-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: #0f172a;
    }

    .project-list-item:hover { background: #111827; }

    .project-list-name {
      color: #e2e8f0;
      font-size: 13px;
    }

    .project-list-actions {
      display: flex;
      gap: 6px;
    }

    .project-list-open, .project-list-delete {
      background: none;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px !important;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px !important;
      min-width: auto !important;
      width: auto !important;
    }

    .project-list-open:hover { border-color: #059669; color: #10b981; background: none !important; }
    .project-list-delete:hover { border-color: #dc2626; color: #f87171; background: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Circuit Simulator</h1>
    <div class="toolbar" id="toolbar">
      <button data-tool="select" class="active">Selecionar</button>
      <div class="sep"></div>
      <button data-tool="VoltageSource">Fonte V</button>
      <button data-tool="Resistor">Resistor</button>
      <button data-tool="Capacitor">Capacitor</button>
      <button data-tool="Inductor">Indutor</button>
      <button data-tool="Diode">Diodo</button>
      <button data-tool="LED">LED</button>
      <button data-tool="CurrentSource">Fonte I</button>
      <div class="sep"></div>
      <button data-tool="wire">Fio</button>
      <button data-tool="ground">GND</button>
      <button data-tool="probe">Probe</button>
      <div class="sep"></div>
      <button id="btn-rotate" title="Rotacionar 90° (R)">&#8635; Rotacionar</button>
    </div>
    <div class="actions">
      <div class="project-menu-wrapper">
        <button id="btn-project">Projeto &#9662;</button>
        <div class="project-dropdown" id="project-dropdown">
          <button data-action="new">Novo Projeto</button>
          <button data-action="save">Salvar</button>
          <button data-action="save-as">Salvar Como...</button>
          <hr/>
          <button data-action="open">Abrir Projeto...</button>
          <hr/>
          <button data-action="export">Exportar JSON</button>
          <button data-action="import">Importar JSON</button>
          <hr/>
          <button data-action="examples">Exemplos</button>
        </div>
      </div>
      <button class="simulate" id="btn-simulate">&#9654; Simular DC</button>
      <button class="transient-btn" id="btn-transient">&#9654; Transiente</button>
      <button class="demo-btn" id="btn-demo">Demo RLC</button>
      <button class="danger" id="btn-clear">Limpar</button>
    </div>
  </header>

  <div class="main">
    <div class="canvas-area">
      <canvas id="canvas"></canvas>
      <div class="bottom-panel" id="bottom-panel">
        <div class="bottom-tabs">
          <button class="tab active" data-tab="editor">Editor</button>
          <button class="tab" data-tab="chart">Grafico</button>
          <div class="tab-actions">
            <button class="run-btn" id="btn-run-code">&#9654; Executar</button>
            <button class="gen-btn" id="btn-gen-code">Gerar Codigo</button>
          </div>
        </div>
        <div class="tab-content active" id="editor-content" data-tab="editor">
          <div class="editor-area">
            <textarea id="code-editor" spellcheck="false"></textarea>
            <div id="console-output"></div>
          </div>
        </div>
        <div class="tab-content" id="chart-content" data-tab="chart">
          <canvas id="chart-canvas"></canvas>
        </div>
      </div>
    </div>
    <div class="sidebar" id="sidebar">
      <h2>Propriedades</h2>
      <div id="props-content">
        <p style="color:#475569; font-size:12px;">Selecione um componente</p>
      </div>
      <div class="results" id="results"></div>
      <div class="sim-controls">
        <h2>Transiente</h2>
        <div class="prop-group">
          <label>Passo (s)</label>
          <input type="text" id="sim-dt" value="1e-6" />
        </div>
        <div class="prop-group">
          <label>Duracaoo (s)</label>
          <input type="text" id="sim-duration" value="5e-3" />
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-text">Pronto</span>
    <span id="mouse-pos">0, 0</span>
  </div>

  <div id="value-dialog">
    <div class="dialog-box">
      <h3 id="dialog-title">Valor do componente</h3>
      <input type="text" id="dialog-input" />
      <div class="dialog-buttons">
        <button class="btn-cancel" id="dialog-cancel">Cancelar</button>
        <button class="btn-ok" id="dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="project-dialog">
    <div class="dialog-box">
      <h3 id="project-dialog-title">Projeto</h3>
      <div id="project-dialog-body"></div>
      <div class="dialog-buttons">
        <button class="btn-cancel" id="project-dialog-cancel">Cancelar</button>
        <button class="btn-ok" id="project-dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-file-input" accept=".json" style="display:none" />

  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
